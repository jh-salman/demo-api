# Host Nginx load balancer → Docker API replicas
# Copy:  cp deploy/nginx-demo-api.conf /etc/nginx/sites-available/salonx-demo-api
# Enable: ln -sf /etc/nginx/sites-available/salonx-demo-api /etc/nginx/sites-enabled/
# Test:   nginx -t && systemctl reload nginx
# SSL:    certbot --nginx -d api.salonx.com

# Load balancer pool (Socket.IO sticky via ip_hash; Redis adapter syncs across nodes)
upstream salonx_demo_api {
    ip_hash;

    server 127.0.0.1:4000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:4002 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

server {
    listen 80;
    server_name api.salonx.com;

    client_max_body_size 25m;

    location /health {
        proxy_pass http://salonx_demo_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://salonx_demo_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://salonx_demo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
